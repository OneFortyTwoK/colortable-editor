[pytest]
testpaths = tests
# A test still running after 5 minutes prints every thread's stack, so a hang names itself.
faulthandler_timeout = 300
# The program's own code must not use anything Python has marked for removal.
filterwarnings =
    error:.*:DeprecationWarning:tcviz
    error:.*:DeprecationWarning:tcviz_gui
    error:.*:DeprecationWarning:colortable_editor
